<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Research question to privacy verdict</title>
  <desc id="hero-desc">Three connected stages show a natural-language question becoming a SPARQL query, then receiving a privacy verdict.</desc>

  <rect width="1200" height="280" fill="#111d2b"/>
  <rect x="14" y="14" width="1172" height="252" rx="12" fill="none" stroke="#617080" stroke-opacity="0.32"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <path d="M 54 46 H 83" stroke="#c3a573" stroke-width="2" stroke-linecap="round"/>
    <text x="97" y="50" fill="#c3a573" font-size="11" font-weight="650" letter-spacing="2.1">RESEARCH WORKFLOW</text>
    <text x="1148" y="50" text-anchor="end" fill="#b9c5c9" font-size="11" font-weight="600" letter-spacing="1.7">SPHN · NEURAL WAVE 2026</text>
    <path d="M 54 60 H 1148" stroke="#71808d" stroke-opacity="0.32"/>

    <rect x="54" y="82" width="310" height="134" rx="8" fill="#192a3a" stroke="#697989" stroke-opacity="0.6"/>
    <text x="79" y="108" fill="#c3a573" font-size="10" font-weight="700" letter-spacing="1.9">01 / INPUT</text>
    <text x="80" y="174" fill="#f5f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="59">?</text>
    <path d="M 130 130 V 177" stroke="#697989" stroke-opacity="0.65"/>
    <text x="151" y="149" fill="#f5f1e8" font-size="19" font-weight="600">Natural language</text>
    <text x="151" y="174" fill="#bdc9cc" font-size="13">Research question</text>

    <rect x="446" y="82" width="310" height="134" rx="8" fill="#192a3a" stroke="#697989" stroke-opacity="0.6"/>
    <text x="471" y="108" fill="#c3a573" font-size="10" font-weight="700" letter-spacing="1.9">02 / TRANSLATE</text>
    <text x="469" y="167" fill="#f5f1e8" font-family="Menlo, Consolas, monospace" font-size="32" letter-spacing="-5">{ }</text>
    <path d="M 540 130 V 177" stroke="#697989" stroke-opacity="0.65"/>
    <text x="561" y="149" fill="#f5f1e8" font-size="19" font-weight="600">SPARQL</text>
    <text x="561" y="174" fill="#bdc9cc" font-size="13">Structured SELECT</text>

    <rect x="838" y="82" width="310" height="134" rx="8" fill="#192a3a" stroke="#697989" stroke-opacity="0.6"/>
    <text x="863" y="108" fill="#c3a573" font-size="10" font-weight="700" letter-spacing="1.9">03 / VERIFY</text>
    <circle cx="886" cy="153" r="22" fill="none" stroke="#c3a573" stroke-width="1.5"/>
    <path d="M 877 153 L 883 159 L 895 146" fill="none" stroke="#c3a573" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 926 130 V 177" stroke="#697989" stroke-opacity="0.65"/>
    <text x="947" y="149" fill="#f5f1e8" font-size="19" font-weight="600">Privacy verdict</text>
    <text x="947" y="174" fill="#bdc9cc" font-size="13">Compliant or flagged</text>

    <path d="M 54 237 H 1148" stroke="#71808d" stroke-opacity="0.32"/>
    <text x="54" y="256" fill="#8fa1aa" font-size="10" font-weight="600" letter-spacing="1.5">OPEN-SOURCE MODELS</text>
    <text x="1148" y="256" text-anchor="end" fill="#8fa1aa" font-size="10" font-weight="600" letter-spacing="1.5">DATABASE-AGNOSTIC REQUEST PATH</text>
  </g>

  <path d="M 381 149 H 429 M 421 141 L 429 149 L 421 157" fill="none" stroke="#c3a573" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 773 149 H 821 M 813 141 L 821 149 L 813 157" fill="none" stroke="#c3a573" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
