[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sparql"
version = "0.1.0"
description = "Secure natural-language-to-SPARQL gateway for SPHN clinical knowledge graphs"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "rdflib==7.6.0",
  "pyparsing==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nl2sparql = ["demo/*.html", "agents/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
