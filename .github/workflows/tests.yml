name: SIB Doc CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NL2SPARQL_BACKEND: stub
  DEMO_PUBLIC_MODE: 'false'
  DEMO_MIN_GROUP_SIZE: disabled
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    name: Python and frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python scripts/ci/check_release_files.py
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --test tests/frontend/*.test.cjs

  container:
    name: Build, smoke-test and publish container
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build AMD64 image
        run: |
          docker build --platform linux/amd64 --tag nl2sparql:ci \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Smoke-test developer and public modes
        run: python scripts/ci/smoke_container.py --image nl2sparql:ci --platform linux/amd64
      - name: Publish tested image to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag nl2sparql:ci "$image:sha-$GITHUB_SHA"
          docker tag nl2sparql:ci "$image:main"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:main"

  ci:
    name: CI required checks
    if: ${{ always() }}
    needs: [tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tests and container checks to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success
